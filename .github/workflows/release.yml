name: Release checks
# Run on a version tag or by hand before uploading to a store. Real values live in repository Variables (Settings > Secrets and variables > Actions > Variables); none are secrets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/plan-b-mvp
env:
  PUBLIC_URL: ${{ vars.PUBLIC_URL }}
  VITE_API_BASE: ${{ vars.VITE_API_BASE }}
  VITE_SITE_DOMAIN: ${{ vars.VITE_SITE_DOMAIN }}
  VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
  VITE_ABUSE_EMAIL: ${{ vars.VITE_ABUSE_EMAIL }}
  VITE_PRIVACY_EMAIL: ${{ vars.VITE_PRIVACY_EMAIL }}
  PLANB_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
  PLANB_ABUSE_EMAIL: ${{ vars.VITE_ABUSE_EMAIL }}
  PLANB_PRIVACY_EMAIL: ${{ vars.VITE_PRIVACY_EMAIL }}
  PLANB_REQUIRE_REAL_CONTACTS: "1"
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/plan-b-mvp/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/plan-b-mvp/web/package-lock.json
      - run: pip install -r requirements.txt pip-audit
      - run: node ../../scripts/bump-version.mjs --check
      - run: python placeholders.py --strict
      - run: PLANB_NO_BACKGROUND=1 PLANB_QUIET=1 python -m unittest -q
      - run: pip-audit -r requirements.txt
      - run: npm ci --no-fund
        working-directory: apps/plan-b-mvp/web
      - run: npm test
        working-directory: apps/plan-b-mvp/web
      - run: npm run build
        working-directory: apps/plan-b-mvp/web
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: apps/plan-b-mvp/web
