name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/plan-b-mvp
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/plan-b-mvp/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      - run: PLANB_NO_BACKGROUND=1 PLANB_QUIET=1 python -m unittest -q
      - run: pip-audit -r requirements.txt
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/plan-b-mvp/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/plan-b-mvp/web/package-lock.json
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
