<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090A0F">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Plan B finds a practical way to your destination when public transport is disrupted, and helps you choose lower-emission journeys every day.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Plan B">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Plan B</title>
  <script>
    // Apply the saved theme before first paint (default Dark) so there is no flash. app.js keeps the same rules in applyTheme().
    try {
      const saved = JSON.parse(localStorage.getItem("planb.settings") || "{}");
      const theme = saved.theme === "light" || (saved.theme === "system" && !matchMedia("(prefers-color-scheme: dark)").matches) ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#EEF0F5" : "#090A0F";
      if (saved.motion === "reduced") document.documentElement.dataset.motion = "reduced";
    } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app" id="app" data-screen="home">
    <main class="viewport" id="viewport"></main>
    <div class="demo-pill" id="demo-pill" hidden>
      <button class="demo-edit" data-action="open-demo" aria-label="Demo mode: edit settings"><span class="demo-dot"></span>Demo mode</button>
      <button class="demo-exit" data-action="demo-exit" aria-label="Exit demo mode"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
