<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090A0F">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Reroute plans your everyday trips with public transport first, shows the CO2 you avoid compared with driving, and finds a practical way there when your journey is disrupted.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reroute">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Reroute</title>
  <script>
    // Apply the saved theme before first paint (default Dark) so there is no flash. app.js keeps the same rules in applyTheme().
    try {
      const saved = JSON.parse(localStorage.getItem("planb.settings") || "{}");
      const theme = saved.theme === "light" || (saved.theme === "system" && !matchMedia("(prefers-color-scheme: dark)").matches) ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#EEF0F5" : "#090A0F";
      if (saved.motion === "reduced") document.documentElement.dataset.motion = "reduced";
    } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app" id="app" data-screen="home">
    <div class="net-banner" id="net-banner" role="status" aria-live="polite" hidden></div>
    <div class="splash" id="splash" aria-hidden="true"><svg width="88" height="88" viewBox="0 0 64 64"><defs><linearGradient id="splg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D70F5"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#splg)"/><path d="M16 48 L48 16" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 7"/><path d="M28.5 31.5l7 7M35.5 31.5l-7 7" stroke="#FCA5A5" stroke-width="3.6" stroke-linecap="round"/><path class="rt" d="M16 48 C16 30 27 18 45 18" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><circle cx="16" cy="48" r="5" fill="#34D399" stroke="#fff" stroke-width="2.6"/><g class="dot"><circle cx="47" cy="17" r="6" fill="#fff"/><circle cx="47" cy="17" r="2.6" fill="#4F46E5"/></g></svg></div>
    <main class="viewport" id="viewport"></main>
    <div class="demo-pill" id="demo-pill" hidden>
      <button class="demo-edit" data-action="open-demo" aria-label="Demo mode: edit settings"><span class="demo-dot"></span>Demo mode</button>
      <button class="demo-exit" data-action="demo-exit" aria-label="Exit demo mode"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </div>
  <script src="offline.js"></script>
  <script src="app.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="motion.js"></script>
</body>
</html>
